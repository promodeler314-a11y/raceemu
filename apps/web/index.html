<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // base: './' で資産を相対参照にしている（サブパスに置くため）。
      // 末尾に "/" が無いと、ブラウザは資産の URL を今いる階層の親から解決してしまい
      // （例 "/raceemu" → "/assets/..."）、真っ白な画面になる。ここで先に付け直す。
      (function () {
        var path = location.pathname;
        if (!path.endsWith('/') && !/\.[^/]+$/.test(path)) {
          location.replace(path + '/' + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 絵文字をアイコンの代わりにしない（docs/ui-audit-race-emulator.md 第1節「要素」）。折れ線 1 本の図にする -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312120f'/%3E%3Cpath d='M3 11.5 6.5 7.5 9.5 9.5 13 4.5' fill='none' stroke='%23fcfcfb' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap"
    />
    <script>
      // 最初の描画の前にテーマを当てる。後から当てると明色が一瞬見える。
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('raceemu-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>レースエミュレータ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
