# コンテナイメージを組んで GitHub Container Registry に置く。
#
# k3s はここから引く。手元で `docker build` して転送する手順を挟むと、
# 何が動いているのかがコミットから追えなくなる。
#
# pull request では組むだけで置かない。Dockerfile が壊れていることに
# マージしてから気付く、という事故をここで止める。
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main には `main` と `sha-<短縮>` の 2 つを付ける。
      # 常用は main、どの版が動いているかを固定したいときは sha を指す。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依存の取得とビルドが毎回走ると 5 分では終わらない。
          cache-from: type=gha
          cache-to: type=gha,mode=max
