# 取り込む前に検査する。
#
# main と pull request の両方で走らせる。配信は切り離してある
# （GitHub Pages への配信は廃止した。docs/deploy.md の 5 節）。
# 壊れたものが出ていく事故は、e2e が成果物を実際に配信して叩くところで止まる。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から読まれる。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      # 画面の読み取りの検査は学習データが要る。無ければその検査だけ飛ぶので、
      # ここで取っておかないと繋がっていることを誰も確かめない。
      - run: node scripts/fetch-tessdata.mjs
      - run: pnpm test
      - run: pnpm build

      # e2e はビルドした成果物を実際に配信してブラウザで叩く。
      # ランナーにブラウザ本体は入っていないので、ここで入れる。
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
